<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guided Wizard — NyayaSetu</title>
<meta name="description" content="Answer a few simple questions to get the right authority, checklist and official portal.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/design.css">
</head>
<body>
<div id="site-header"></div>
<main class="section">
  <div class="container wizard-shell">
    <div class="sec-head" style="margin-bottom:1rem">
      <span class="kicker" id="w-cat">[ Guided wizard ]</span>
      <h2 id="w-title">Tell us a little about the problem</h2>
      <p style="color:var(--muted)" id="w-desc"></p>
    </div>
    <div class="step-meta" id="w-stepmeta">Step 1</div>
    <div class="progress" aria-hidden="true"><i id="w-bar"></i></div>
    <div class="step-card">
      <form id="w-form" novalidate></form>
      <div class="wizard-nav">
        <button class="btn btn-ghost" id="w-back" type="button">← Back</button>
        <button class="btn btn-primary magnetic" id="w-next" type="button">Next →</button>
      </div>
    </div>
    <p style="font-size:.78rem;color:var(--muted);margin-top:1rem">We never ask for Aadhaar, PAN, OTPs, passwords or bank credentials. Your answers stay on your device.</p>
  </div>
</main>
<div id="site-footer"></div>
<script src="data/data.js"></script>
<script src="assets/js/engine.js"></script>
<script src="partials.js"></script>
<script src="assets/js/core.js"></script>
<script>
(function(){
  const pid=new URLSearchParams(location.search).get('problem');
  const prob=NyayaEngine.getProblem(pid);
  const form=document.getElementById('w-form'),bar=document.getElementById('w-bar'),
        meta=document.getElementById('w-stepmeta'),back=document.getElementById('w-back'),
        next=document.getElementById('w-next');
  if(!prob){
    document.getElementById('w-title').textContent='Problem not found';
    document.querySelector('.step-card').innerHTML='<p>Please choose a problem first.</p><div style="margin-top:1rem"><a class="btn btn-primary" href="problems.html">Browse problems →</a></div>';
    back.style.display='none';next.style.display='none';meta.textContent='';return;
  }
  document.getElementById('w-cat').textContent='[ '+prob.cat+' ]';
  document.getElementById('w-title').textContent=prob.title;
  document.getElementById('w-desc').textContent=prob.desc;

  const qs=prob.qs||[];
  const stateKey='nyayasetu_wizard_'+pid;
  let values={};try{values=JSON.parse(sessionStorage.getItem(stateKey)||'{}')}catch(e){}
  let step=0;

  function render(){
    const q=qs[step];form.innerHTML='';
    if(q){
      const key=q[0],label=q[1],type=q[2],opts=q[3],labels=q[4]||{};
      const div=document.createElement('div');div.className='field';
      const id='f_'+key;let input;
      if(type==='select'){
        input=document.createElement('select');input.className='input';
        const ph=document.createElement('option');ph.value='';ph.textContent='Select…';input.appendChild(ph);
        (opts||[]).forEach(o=>{const op=document.createElement('option');op.value=o;op.textContent=labels[o]||o;input.appendChild(op);});
      }else if(type==='textarea'){input=document.createElement('textarea');input.className='input';}
      else{input=document.createElement('input');input.className='input';input.type=(type==='number'||type==='date')?type:'text';}
      input.id=id;input.name=key;input.value=values[key]||'';
      const lab=document.createElement('label');lab.setAttribute('for',id);
      lab.innerHTML=label+' <span class="req" aria-hidden="true">*</span>';
      const err=document.createElement('div');err.className='err';err.textContent='Please answer this to continue.';
      div.appendChild(lab);div.appendChild(input);div.appendChild(err);form.appendChild(div);
      setTimeout(()=>input.focus(),50);
    }
    const total=qs.length;
    meta.textContent='Step '+(step+1)+' of '+total;
    bar.style.width=Math.round((step/total)*100)+'%';
    back.disabled=step===0;back.style.opacity=step===0?.5:1;
    next.textContent=step===qs.length-1?'See my action plan →':'Next →';
  }
  function valid(){
    const q=qs[step];if(!q)return true;
    const inp=form.querySelector('.input');const field=form.querySelector('.field');
    if(!inp.value.trim()){field.classList.add('invalid');inp.focus();return false;}
    field.classList.remove('invalid');values[q[0]]=inp.value.trim();return true;
  }
  next.addEventListener('click',()=>{
    if(!valid())return;
    sessionStorage.setItem(stateKey,JSON.stringify(values));
    if(step<qs.length-1){step++;render();}
    else{sessionStorage.setItem('nyayasetu_answers_'+pid,JSON.stringify(values));
      location.href='recommendation.html?problem='+encodeURIComponent(pid);}
  });
  back.addEventListener('click',()=>{ if(step>0){step--;render();} else location.href='problems.html'; });
  form.addEventListener('keydown',(e)=>{ if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA'){e.preventDefault();next.click();} });
  render();
})();
</script>
</body>
</html>
