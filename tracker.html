<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Tracker — NyayaSetu</title>
<meta name="description" content="Your private, on-device tracker for complaints and follow-ups.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/design.css">
</head>
<body>
<div id="site-header"></div>
<main class="section">
  <div class="container">
    <div class="sec-head reveal">
      <span class="kicker">[ Local & private ]</span>
      <h2>My case tracker</h2>
      <p>Stored only in your browser (LocalStorage) — nothing is sent to any server. Add the reference number after you file on the official portal.</p>
    </div>

    <!-- add / edit form -->
    <div class="card reveal" style="margin-bottom:1.4rem" id="t-editor">
      <h3 id="t-formtitle" style="margin-bottom:.8rem">Add a case</h3>
      <input type="hidden" id="t-id">
      <div class="grid c2" style="gap:.8rem">
        <div class="field"><label for="t-title">Title *</label><input class="input" id="t-title" placeholder="e.g. Refund for order #123"><div class="err">Title is required.</div></div>
        <div class="field"><label for="t-portal">Portal / authority</label><input class="input" id="t-portal" placeholder="e.g. CPGRAMS"></div>
        <div class="field"><label for="t-ref">Reference no.</label><input class="input" id="t-ref" placeholder="e.g. registration no."></div>
        <div class="field"><label for="t-due">Reminder / due date</label><input class="input" id="t-due" type="date"></div>
        <div class="field"><label for="t-status">Status</label><select class="input" id="t-status"><option>Prepared</option><option>Submitted</option><option>Resolved</option></select></div>
        <div class="field"><label for="t-notes">Notes</label><input class="input" id="t-notes" placeholder="Short note"></div>
      </div>
      <div style="display:flex;gap:.6rem;margin-top:.4rem;flex-wrap:wrap">
        <button class="btn btn-primary btn-sm" id="t-save">Save case</button>
        <button class="btn btn-ghost btn-sm" id="t-cancel" style="display:none">Cancel edit</button>
        <button class="btn btn-ghost btn-sm" id="t-clear">Clear all</button>
      </div>
    </div>

    <div id="t-list" class="grid" style="gap:.9rem"></div>
    <div class="empty" id="t-empty" style="display:none">No saved cases yet. Finish a wizard and choose “Save to tracker”, or add one above.</div>
  </div>
</main>
<div id="site-footer"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="data/data.js"></script>
<script src="assets/js/engine.js"></script>
<script src="partials.js"></script>
<script src="assets/js/core.js"></script>
<script>
(function(){
  const list=document.getElementById('t-list'),empty=document.getElementById('t-empty');
  const F=id=>document.getElementById(id);
  function statusClass(s){return s==='Resolved'?'resolved':(s==='Submitted'?'submitted':'prepared');}
  function render(){
    const items=NyayaEngine.loadTrackerItems();
    list.innerHTML='';empty.style.display=items.length?'none':'block';
    items.forEach(it=>{
      const div=document.createElement('div');div.className='titem reveal';
      div.innerHTML=`<div class="grow"><div class="ref">${it.title||'Untitled'}</div>
        <div style="font-size:.8rem;color:var(--muted)">${it.portalName||''}${it.referenceNo?(' • Ref: '+it.referenceNo):''} • created ${it.createdAt||''}${it.dueAt?(' • due '+it.dueAt):''}</div>
        ${it.notes?('<div style="font-size:.82rem;margin-top:.2rem">'+it.notes+'</div>'):''}</div>`;
      const badge=document.createElement('span');badge.className='status '+statusClass(it.status);badge.textContent=it.status;
      const edit=document.createElement('button');edit.className='btn btn-ghost btn-sm';edit.textContent='Edit';
      edit.addEventListener('click',()=>{
        F('t-id').value=it.id;F('t-title').value=it.title||'';F('t-portal').value=it.portalName||'';
        F('t-ref').value=it.referenceNo||'';F('t-due').value=it.dueAt||'';F('t-status').value=it.status||'Prepared';F('t-notes').value=it.notes||'';
        F('t-formtitle').textContent='Edit case';F('t-cancel').style.display='inline-flex';
        F('t-title').focus();window.scrollTo({top:0,behavior:'smooth'});
      });
      const del=document.createElement('button');del.className='btn btn-ghost btn-sm';del.textContent='Delete';
      del.addEventListener('click',()=>{if(confirm('Delete this item?')){NyayaEngine.deleteTrackerItem(it.id);render();}});
      const right=document.createElement('div');right.style.display='flex';right.style.gap='.5rem';right.style.alignItems='center';
      right.appendChild(badge);right.appendChild(edit);right.appendChild(del);
      div.appendChild(right);list.appendChild(div);
    });
  }
  F('t-save').addEventListener('click',()=>{
    const title=F('t-title').value.trim();
    F('t-title').closest('.field').classList.toggle('invalid',!title);
    if(!title){window.nyToast('Please enter a title','err');return;}
    const id=F('t-id').value||undefined;
    NyayaEngine.saveTrackerItem({id:id,title:title,portalName:F('t-portal').value.trim(),
      referenceNo:F('t-ref').value.trim(),dueAt:F('t-due').value,status:F('t-status').value,notes:F('t-notes').value.trim()});
    ['t-id','t-title','t-portal','t-ref','t-due','t-notes'].forEach(i=>F(i).value='');
    F('t-status').value='Prepared';F('t-formtitle').textContent='Add a case';F('t-cancel').style.display='none';
    window.nyToast(id?'Case updated':'Case added','ok');render();
  });
  F('t-cancel').addEventListener('click',()=>{
    ['t-id','t-title','t-portal','t-ref','t-due','t-notes'].forEach(i=>F(i).value='');
    F('t-formtitle').textContent='Add a case';F('t-cancel').style.display='none';
  });
  F('t-clear').addEventListener('click',()=>{if(confirm('Delete ALL tracker items? This cannot be undone.')){localStorage.removeItem('nyayasetu_tracker_v1');render();}});
  render();
})();
</script>
</body>
</html>
