<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Action Plan — NyayaSetu</title>
<meta name="description" content="Your authority, document checklist, step-by-step plan and the verified official portal.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/design.css">
</head>
<body>
<div id="site-header"></div>
<main class="section">
  <div class="container">
    <div class="sec-head" style="margin-bottom:1.4rem">
      <span class="kicker">[ Your action plan ]</span>
      <h2 id="r-title">Here's your clear next step</h2>
    </div>
    <div id="r-body"></div>
  </div>
</main>
<div id="site-footer"></div>
<script src="data/data.js"></script>
<script src="assets/js/engine.js"></script>
<script src="partials.js"></script>
<script src="assets/js/core.js"></script>
<script>
(function(){
  const pid=new URLSearchParams(location.search).get('problem');
  let answers={};try{answers=JSON.parse(sessionStorage.getItem('nyayasetu_answers_'+pid)||'{}')}catch(e){}
  const R=NyayaEngine.evaluateRules(pid,answers);
  const body=document.getElementById('r-body');
  if(!R){body.innerHTML='<div class="empty">No plan found. <a href="problems.html">Choose a problem</a>.</div>';return;}
  document.getElementById('r-title').textContent=R.problem.title;
  const s=R.source,rt=R.route;
  const emergency=R.emergency?'<div class="card reveal" style="border-color:#e2a3a3;background:#fdecea"><h3 style="color:#8e2c1c">🚨 Emergency</h3><p style="color:#8e2c1c">If anyone is in immediate danger, call <b>112</b> now. NyayaSetu cannot handle emergencies.</p></div>':'';
  body.innerHTML=emergency+`
  <div class="plan-grid">
    <div>
      <div class="card reveal">
        <span class="kicker">Relevant authority</span>
        <h3 style="margin:.6rem 0 .2rem">${rt.authorityName}</h3>
        <p style="font-size:.8rem;color:var(--green-700);font-weight:700">${rt.authorityType}</p>
        <p style="color:var(--muted);font-size:.9rem;margin-top:.4rem">${rt.purpose}</p>
        ${rt.exclusions&&rt.exclusions.length?('<p style="font-size:.78rem;color:var(--muted);margin-top:.4rem"><b>Not for:</b> '+rt.exclusions.join('; ')+'</p>'):''}
      </div>
      <div class="card reveal" style="margin-top:1.2rem">
        <h3 style="margin-bottom:.6rem">📋 Documents / evidence to prepare</h3>
        <ul class="checklist" id="docs"></ul>
      </div>
      <div class="card reveal" style="margin-top:1.2rem">
        <h3 style="margin-bottom:.6rem">🧭 Step-by-step plan</h3>
        <ol class="steps">${rt.steps.map(s=>'<li>'+s+'</li>').join('')}</ol>
      </div>
    </div>
    <div>
      <div class="portal-card reveal">
        <span class="badge">VERIFIED OFFICIAL PORTAL</span>
        <h3>${s?s.sourceName:rt.authorityName}</h3>
        <p style="font-size:.85rem;opacity:.95">${s?s.scope:''}</p>
        <p style="font-size:.75rem;opacity:.9">${s?s.disclaimer:''} • Verified ${s?s.verifiedOn:''}</p>
        <a class="portal-link magnetic" href="${s?s.officialUrl:'#'}" target="_blank" rel="noopener noreferrer">Open official portal ↗</a>
        <p style="font-size:.72rem;margin-top:.8rem;opacity:.9">External site — NyayaSetu does not operate this portal.</p>
      </div>
      <div class="card reveal" style="margin-top:1.2rem">
        <h3 style="margin-bottom:.6rem">✍️ Complaint draft <span style="font-size:.7rem;color:var(--muted);font-weight:600">(editable template — not legal advice)</span></h3>
        <p style="font-size:.85rem;color:var(--muted);margin-bottom:.7rem">Pre-filled from your answers. Edit before sending; no outcome is guaranteed and nothing is submitted for you.</p>
        <div style="font-weight:700;margin-bottom:.5rem" id="draft-subject"></div>
        <div class="draft-box" id="draft-body" contenteditable="true" aria-label="Editable complaint draft"></div>
        <div style="display:flex;gap:.6rem;margin-top:.9rem;flex-wrap:wrap">
          <button class="btn btn-primary btn-sm" id="copy">Copy draft</button>
          <button class="btn btn-ghost btn-sm" id="save">Save to tracker</button>
        </div>
      </div>
    </div>
  </div>`;
  const docs=document.getElementById('docs');
  R.docs.forEach(d=>{const li=document.createElement('li');li.innerHTML='<div class="box" role="checkbox" tabindex="0" aria-checked="false"></div><span>'+d+'</span>';
    const box=li.querySelector('.box');
    const toggle=()=>{li.classList.toggle('done');box.setAttribute('aria-checked',li.classList.contains('done'));};
    box.addEventListener('click',toggle);
    box.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();toggle();}});
    docs.appendChild(li);});
  const d=NyayaEngine.generateDraft(R.draft,answers);
  document.getElementById('draft-subject').textContent='Subject: '+d.subject;
  document.getElementById('draft-body').textContent=d.body;
  document.getElementById('copy').addEventListener('click',()=>{
    const txt=document.getElementById('draft-subject').textContent+'\n\n'+document.getElementById('draft-body').textContent;
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>window.nyToast('Draft copied','ok')).catch(()=>window.nyToast('Copy failed — select and copy manually','err'));
  });
  document.getElementById('save').addEventListener('click',()=>{
    NyayaEngine.saveTrackerItem({title:R.problem.title,portalName:s?s.sourceName:rt.authorityName,status:'Prepared',referenceNo:'',notes:d.subject});
    window.nyToast('Saved to your local tracker','ok');
    setTimeout(()=>location.href='tracker.html',600);
  });
})();
</script>
</body>
</html>
